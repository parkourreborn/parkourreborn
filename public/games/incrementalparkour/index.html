<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Incremental Parkour</title>
    <style>
      html, body { height: 100%; margin: 0; overflow: hidden; background: #05080d; }
      #unity-canvas { display: block; width: 100%; height: 100%; background: #05080d; }
      #load {
        position: absolute;
        inset: 0;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 14px;
        color: #a8b4c0;
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      #bar { width: min(280px, 60vw); height: 3px; overflow: hidden; border-radius: 2px; background: rgba(210, 225, 235, 0.12); }
      #bar i { display: block; width: 0; height: 100%; background: #36b9ec; transition: width 140ms ease; }
      #load.hide { display: none; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="load"><span>Loading</span><div id="bar"><i></i></div></div>
    <script src="save-bridge.js"></script>
    <script src="1.0.0.loader.js"></script>
    <script>
      var load = document.getElementById('load');
      var fill = document.querySelector('#bar i');
      var canvas = document.querySelector('#unity-canvas');
      var dpr = window.devicePixelRatio || 1;

      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: '1.0.0.data.unityweb',
        frameworkUrl: '1.0.0.framework.js.unityweb',
        codeUrl: '1.0.0.wasm.unityweb',
        streamingAssetsUrl: 'StreamingAssets',
        companyName: 'Elk Studios',
        productName: 'Incremental Parkour',
        productVersion: '1.0',
      }, function (progress) {
        fill.style.width = Math.round(progress * 100) + '%';
      }).then(function (instance) {
        window.ParkourSave.attach(instance);
        load.classList.add('hide');
        canvas.focus();
      }).catch(function (message) {
        load.innerHTML = '<span>Could not load the game</span>';
        console.error(message);
      });
    </script>
  </body>
</html>
